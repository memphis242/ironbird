# A span that cannot fit in any packet (start + distance from the end above 65535).
name = "p"
kind = "telemetry"
mid_fields = ["mid"]

[[fields]]
name = "mid"
bits = 16
computed = "from_mid"

[[fields]]
name = "ck"
bits = 8
computed = "checksum"
algorithm = "xor8_cfs"
span = { start = 65000, end = -1000 }
