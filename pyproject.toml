[build-system]
requires = ["setuptools>=77"]  # 77 adds the SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "ironbird"
version = "0.1.0"
description = "Terminal integrated/system test tool for cFS flight software vehicles"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12,<1",
    "pyserial>=3.5,<4",  # opens and configures serial devices; the loop drives the descriptor
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10",  # patch = ["subprocess"] and the [tool.coverage] section below
    "pytest>=8,<9",  # pytest-benchmark 5.x is not yet compatible with pytest 9
    "pytest-xdist>=3.5,<4",
    "hypothesis>=6.100,<7",
    "pytest-benchmark>=4.0,<6",
    "ruff>=0.5,<0.18",  # lint and format rules change between minor releases
    "pyright[nodejs]>=1.1.370,<1.2",  # nodejs extra: the Node pyright runs on comes from PyPI
    "mypy>=1.11,<3",  # second type checker: catches what pyright's inference lets through
    "types-pyserial>=3.5,<4",  # mypy has no inline stubs for pyserial (pyright bundles typeshed's)
    "bandit[toml]>=1.8,<2",  # security linter; configured under [tool.bandit]
    "pyyaml>=6,<7",  # tests/test_ci_el8.py parses the CI workflow
    "types-pyyaml>=6,<7",
]
fuzz = ["atheris>=2.3,<4"]
# Dependency-vulnerability audit (scheduled CI job) and the packaging check (tools/ci/check-package.sh).
# Separate extras: neither is needed to develop, and pip-audit pulls a large dependency tree.
audit = ["pip-audit>=2.7,<3"]
package = [
    "build>=1.2,<2",
    "twine>=5,<8",
]
# constraints-dev.txt pins the exact tool versions CI installs with (pip install -c ...).

[project.scripts]
ironbird = "ironbird.cli.launch:main"
ib = "ironbird.cli.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ironbird = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --benchmark-disable-gc --benchmark-min-rounds=5"
markers = [
    "benchmark: pytest-benchmark performance test",
    "cfs: needs a real cFS build (tools/cfs); opt-in via IRONBIRD_CFS=1 or -m cfs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "S"]
ignore = [
    "PLR2004",  # magic values are common in wire-format code
    "PLR0913",  # keyword-heavy constructors are intentional
    "PLR0917",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "S101",     # asserts are the project's assertive-programming tool
    "RUF012",
    "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "S104", "S108", "S603", "S607", "PLR0915"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportMissingParameterType = false

[tool.mypy]
# src only: pyright (strict) already checks the tests, and mypy's stricter reading of test
# idioms (monkeypatching module attributes, re-exported names) is left to a later pass.
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
]
show_error_codes = true
pretty = false

[tool.bandit]
# Bandit scans the shipped code only; tests and tools use asserts, subprocess and fixed
# temp paths by design (ruff's "S" rules cover them with per-file ignores).
targets = ["src"]
# Every skip is justified inline next to the code it covers; nothing is disabled globally.
# A skip is written `# nosec B301  # reason` (text after a second `#`; bandit
# reads any words after the id as more test ids). B101 (assert) is the one exception: asserts are the project's
# assertive-programming tool (see CLAUDE.md), so the test is excluded for the whole tree.
skips = ["B101"]

# Branch coverage of src/ironbird. Run it with tools/coverage.sh: several tests start `ib` as a
# subprocess with a scrubbed environment, so a plain `coverage run` would miss that code; the
# script makes every Python process of the test run measure itself.
[tool.coverage.run]
branch = true
source = ["ironbird"]
parallel = true  # one data file per process (parent, xdist workers, subprocesses), combined after
patch = ["subprocess"]
omit = ["*/__pycache__/*"]

[tool.coverage.paths]
ironbird = ["src/ironbird", "*/site-packages/ironbird"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
fail_under = 94  # branch, with the exclusions below; the margin under the measured total absorbs timing-skipped paths
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError\\(",  # unreachable-by-construction guards
    "^\\s+\\.\\.\\.$",  # Protocol method bodies
]
