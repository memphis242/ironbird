name: ci

# Two families of jobs, on purpose:
#   checks / cfs          Ubuntu runner, setup-python: fast feedback (cached, ~minutes) on the
#                         newest toolchain, and the home of the coverage that needs a real VM.
#   el8-checks / el8-cfs  the same lint/types/tests and real-cFS acceptance inside Oracle Linux 8
#                         (and, best effort, UBI 8) containers, as an unprivileged user: the
#                         user's target servers are RHEL 8 / Oracle Linux 8 (glibc 2.28, gcc 8,
#                         EL8 AppStream python3.11 and cmake). They catch what Ubuntu hides:
#                         old-toolchain warnings under cFS -Werror, missing util-linux tools,
#                         wheel/glibc compatibility, pip/venv packaging of the distro Python.
# Containers share the runner's Ubuntu kernel, so kernel-level behaviour (net.core.rmem_max,
# /proc/net/udp, SO_RXQ_OVFL, flock, SysV IPC limits) is NOT EL8's; see README "Supported
# platforms".

# Schedules (github.event.schedule carries the cron string that fired; the `if:` conditions below
# repeat these two strings, and tests/test_ci_schedules.py fails if they drift apart):
#   "17 4 * * *"   nightly: the full push/PR jobs plus `fuzz`
#   "43 5 * * 1"   weekly (Monday): `audit` and `el8-audit` only, nothing else
# A manual workflow_dispatch runs the ordinary jobs plus `audit` and `el8-audit`, so an edit to the
# audit scripts can be exercised before merge instead of first failing on the next weekly run.
# A new advisory can land at any time, so the dependency audit must not gate a push or PR on
# something unrelated to the change; it runs on its own clock and fails loudly there.

on:
  push:
  pull_request:
  workflow_dispatch:  # manual run: the ordinary jobs plus the audit jobs
  schedule:
    - cron: "17 4 * * *"  # nightly fuzzing
    - cron: "43 5 * * 1"  # weekly dependency-vulnerability audit

permissions:
  contents: read

concurrency:
  # The schedule is part of the key: the weekly audit must not cancel a running nightly (or the
  # reverse); on a push or PR the schedule is empty and the key is just the ref.
  group: ci-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    if: github.event.schedule != '43 5 * * 1'  # not the weekly audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install
        run: python -m pip install -c constraints-dev.txt -e '.[dev,fuzz]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          PYRIGHT_PYTHON_DEBUG=1 pyright --version  # logs which Node pyright runs on
          pyright
          mypy
      - name: Security lint (bandit)
        run: bandit -c pyproject.toml -r src
      - name: Tests (real-cFS tests are opt-in and skipped here)
        run: pytest -n auto
      # pytest-benchmark disables itself under xdist, so the ceilings above are only enforced
      # by a serial run.
      - name: Benchmarks (serial, so the performance ceilings are enforced)
        run: pytest tests/test_benchmarks.py -n0
      # 15 s of 200-byte telemetry at the 1k packets/s floor into `ib record`: zero loss, or fail.
      # The 10k packets/s target (60 s) is the development host's: IRONBIRD_BENCH_10K=1.
      - name: Throughput gate (serial, 1k packets/s floor)
        run: pytest tests/bench -n0 -s

  package:
    name: packaging (sdist, wheel, clean install)
    if: github.event.schedule != '43 5 * * 1'  # not the weekly audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install the build tools
        run: python -m pip install -c constraints-dev.txt '.[package]'
      # Builds the sdist and wheel from a copy of the tree, runs `twine check --strict`, checks
      # the wheel and sdist contents (modules, py.typed, entry points, examples), installs the
      # wheel into a clean venv and smoke-runs `ib` and `ironbird` from there.
      - name: Packaging check
        run: tools/ci/check-package.sh

  cfs:
    name: real cFS acceptance
    if: github.event.schedule != '43 5 * * 1'  # not the weekly audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Outside the workspace so the cached tree has one stable absolute path.
      CFS_BUILD_DIR: ${{ github.workspace }}/../cfs-build
      # The generator tests fail, instead of running their lenient accounting mode, when cFS's
      # queues are truncated below the depth of TO_LAB's telemetry pipe (see the sysctl step).
      IRONBIRD_CFS_REQUIRE_FULL_DEPTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Read pinned cFS commit
        id: pin
        run: tools/ci/cache-key.sh >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps: the tree is saved right after the build, before
      # the tests write their own state (cFS run directories, logs) into it.
      - name: Restore cFS checkout and build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CFS_BUILD_DIR }}
          key: cfs-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('tools/cfs/build.sh', 'tools/cfs/apps/**', 'tools/cfs/sample_defs/**') }}
      - name: Build cFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/cfs/build.sh
      - name: Save cFS checkout and build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CFS_BUILD_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Install ironbird
        run: python -m pip install -c constraints-dev.txt -e '.[dev]'
      # A non-root cFS has OSAL truncate every queue to fs.mqueue.msg_max (10 by default), which
      # would cut TO_LAB's 1000-deep telemetry pipe (tools/cfs/sample_defs) to 10; 65536 (the
      # kernel's maximum) only caps that truncation, so every queue keeps the depth cFS requests.
      # The runner has passwordless sudo, and the value is read back so a silent no-op fails the
      # job.
      - name: Raise fs.mqueue.msg_max so cFS keeps its 1000-deep pipes
        run: |
          sudo sysctl -w fs.mqueue.msg_max=65536
          test "$(cat /proc/sys/fs/mqueue/msg_max)" -ge 1000
          echo "fs.mqueue.msg_max = $(cat /proc/sys/fs/mqueue/msg_max)"
      - name: Real-cFS acceptance tests
        env:
          IRONBIRD_CFS: "1"
        # One cFS instance owns fixed UDP ports and /dev/shm/osal:RAM: run serially.
        # -rP lists what the passing tests printed, which includes the generator tests' mode line.
        run: pytest tests/cfs -m cfs -n0 -v -rP --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep cFS console logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cfs-logs
          path: ${{ runner.temp }}/pytest
          if-no-files-found: ignore

  # EL8 jobs. Steps run as the unprivileged user `ci` (the default shell below drops privileges
  # with setpriv and sets no_new_privs, so nothing the tests run can regain them); only the
  # bootstrap, package-install, ownership and cache-key steps run as root, and say so with
  # `shell: bash`. Anything that must write a GITHUB_* file ($GITHUB_OUTPUT, $GITHUB_ENV,
  # $GITHUB_PATH, $GITHUB_STEP_SUMMARY) is a root step: those files belong to the runner, not
  # to `ci`. Every unprivileged `run` step starts with the id check below, and
  # tests/test_ci_el8.py enforces both that and the shell default. The Python venv lives in
  # the user's home, outside the workspace, and is first on PATH for every unprivileged step.
  #
  # UBI 8 is best effort only for one thing: a package its repositories lack (el8-setup.sh
  # exit 3) skips the rest of its job with a warning. Any other failure on it, a test
  # included, fails the job. The image digest is printed by "Initialize containers"; inside
  # the container the setup step prints the release package and toolchain versions.
  el8-checks:
    name: EL8 ${{ matrix.name }} - lint, types, tests
    if: github.event.schedule != '43 5 * * 1'  # not the weekly audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: oraclelinux8, image: "oraclelinux:8", experimental: false }
          - { name: ubi8, image: "redhat/ubi8", experimental: true }
    container:
      image: ${{ matrix.image }}
      # EL8 logins get a soft nofile limit of 1024 (PAM); Docker's default is far higher.
      options: --ulimit nofile=1024:524288
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        shell: >-
          setpriv --reuid=ci --regid=ci --init-groups --no-new-privs
          env HOME=/home/ci USER=ci LOGNAME=ci
          PATH=/home/ci/venv/bin:/usr/local/bin:/usr/bin:/bin
          bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Bootstrap for checkout (root)
        shell: bash
        run: dnf -y --setopt=install_weak_deps=False --nodocs install git tar gzip
      - uses: actions/checkout@v4
      - name: Install EL8 toolchain and create the CI user (root)
        id: setup
        shell: bash
        env:
          BEST_EFFORT: ${{ matrix.experimental }}
        run: |
          status=0
          tools/ci/el8-setup.sh || status=$?
          if [ "$status" -eq 0 ]; then
            chown -R ci:ci "$GITHUB_WORKSPACE"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ] && [ "$BEST_EFFORT" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EL8 packages unavailable::el8-setup.sh found packages this best-effort image cannot supply; the rest of the job is skipped"
          else
            exit "$status"
          fi
      - name: Create venv (EL8 python3.11)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python3.11 -m venv "$HOME/venv"
      - name: Install
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python -m pip install -c constraints-dev.txt -e '.[dev]'
      - name: Lint
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          ruff check .
          ruff format --check .
      - name: Type check
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          PYRIGHT_PYTHON_DEBUG=1 pyright --version  # logs which Node pyright runs on
          pyright
          mypy
      - name: Security lint (bandit)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          bandit -c pyproject.toml -r src
      - name: Tests as a non-root user (real-cFS tests are opt-in and skipped here)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          pytest -n auto
      - name: Benchmarks (serial, so the performance ceilings are enforced)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          pytest tests/test_benchmarks.py -n0
      - name: Throughput gate (serial, 1k packets/s floor)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          pytest tests/bench -n0 -s
      - name: Hand the workspace back to root (root)
        if: always()
        shell: bash
        run: chown -R root:root "$GITHUB_WORKSPACE"

  audit:
    name: dependency vulnerability audit
    # The weekly schedule only (see the comment at the top): fails the run, and so notifies the
    # repository's watchers, when a pinned dev dependency or a runtime dependency (floating
    # inside the pyproject ranges) has a known advisory. Accepted advisories, each with its
    # reason, live in tools/ci/audit-ignore.txt.
    if: github.event.schedule == '43 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install -c constraints-dev.txt '.[audit]'
      - name: Audit the dev and runtime dependency sets
        run: tools/ci/audit-deps.sh

  # The same audit on the EL8 distro Python 3.11 (same container, user and privilege rules as
  # el8-checks): the runtime set resolves under EL8's pip, glibc and platform tags, which can
  # select different wheels than the Ubuntu runner does.
  el8-audit:
    name: EL8 oraclelinux8 - dependency vulnerability audit
    if: github.event.schedule == '43 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: oraclelinux:8
      options: --ulimit nofile=1024:524288
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        shell: >-
          setpriv --reuid=ci --regid=ci --init-groups --no-new-privs
          env HOME=/home/ci USER=ci LOGNAME=ci
          PATH=/home/ci/venv/bin:/usr/local/bin:/usr/bin:/bin
          bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Bootstrap for checkout (root)
        shell: bash
        run: dnf -y --setopt=install_weak_deps=False --nodocs install git tar gzip
      - uses: actions/checkout@v4
      - name: Install EL8 toolchain and create the CI user (root)
        id: setup
        shell: bash
        run: |
          tools/ci/el8-setup.sh
          chown -R ci:ci "$GITHUB_WORKSPACE"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Create venv (EL8 python3.11)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python3.11 -m venv "$HOME/venv"
      - name: Install pip-audit
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python -m pip install -c constraints-dev.txt '.[audit]'
      - name: Audit the dev and runtime dependency sets
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          tools/ci/audit-deps.sh
      - name: Hand the workspace back to root (root)
        if: always()
        shell: bash
        run: chown -R root:root "$GITHUB_WORKSPACE"

  el8-cfs:
    name: EL8 ${{ matrix.name }} - real cFS acceptance
    if: github.event.schedule != '43 5 * * 1'  # not the weekly audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: oraclelinux8, image: "oraclelinux:8", experimental: false }
          - { name: ubi8, image: "redhat/ubi8", experimental: true }
    container:
      image: ${{ matrix.image }}
      # EL8 logins get a soft nofile limit of 1024 (PAM); Docker's default is far higher.
      # fs.mqueue.msg_max is IPC-namespaced, so Docker sets it for this container alone (a
      # namespaced sysctl, allowed unprivileged): a non-root cFS has OSAL truncate every queue to
      # it, and 10 (the default) would cut TO_LAB's 1000-deep telemetry pipe (tools/cfs/sample_defs)
      # to 10. 65536 is the kernel's maximum (HARD_MSGMAX; there is no "unlimited"); it only caps
      # that truncation, so each queue keeps the depth cFS requests (the generator tests check the
      # depth TO_LAB asks for, and fail without it: IRONBIRD_CFS_REQUIRE_FULL_DEPTH below).
      options: --ulimit nofile=1024:524288 --sysctl fs.mqueue.msg_max=65536
    env:
      LANG: en_US.UTF-8
      # Inside the user's home so the cached tree has one stable absolute path.
      CFS_BUILD_DIR: /home/ci/cfs-build
      IRONBIRD_CFS: "1"
      IRONBIRD_CFS_REQUIRE_FULL_DEPTH: "1"
    defaults:
      run:
        shell: >-
          setpriv --reuid=ci --regid=ci --init-groups --no-new-privs
          env HOME=/home/ci USER=ci LOGNAME=ci
          PATH=/home/ci/venv/bin:/usr/local/bin:/usr/bin:/bin
          bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Bootstrap for checkout (root)
        shell: bash
        run: dnf -y --setopt=install_weak_deps=False --nodocs install git tar gzip
      - uses: actions/checkout@v4
      - name: Install EL8 toolchain and create the CI user (root)
        id: setup
        shell: bash
        env:
          BEST_EFFORT: ${{ matrix.experimental }}
        run: |
          status=0
          tools/ci/el8-setup.sh || status=$?
          if [ "$status" -eq 0 ]; then
            chown -R ci:ci "$GITHUB_WORKSPACE"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ] && [ "$BEST_EFFORT" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EL8 packages unavailable::el8-setup.sh found packages this best-effort image cannot supply; the rest of the job is skipped"
          else
            exit "$status"
          fi
      # The key covers the cFS commit, the EL8 toolchain versions (gcc, glibc, cmake) and the
      # scripts that decide how cFS is built.
      - name: Cache key inputs (root)
        id: pin
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: tools/ci/cache-key.sh --toolchain >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps: the tree is saved right after the build, before
      # the tests write their own state (cFS run directories, logs) into it.
      - name: Restore cFS checkout and build
        id: cache
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /home/ci/cfs-build
          key: cfs-el8-${{ matrix.name }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.toolchain }}-${{ hashFiles('tools/cfs/build.sh', 'tools/cfs/apps/**', 'tools/cfs/sample_defs/**', 'tools/ci/el8-setup.sh', 'tools/ci/cache-key.sh') }}
      - name: Hand the restored cache to the CI user (root)
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p /home/ci/cfs-build
          chown -R ci:ci /home/ci/cfs-build
      - name: Build cFS (gcc 8, as the CI user)
        if: steps.setup.outputs.ready == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          test "$(id -u)" -ne 0
          tools/cfs/build.sh
      - name: Save cFS checkout and build
        if: steps.setup.outputs.ready == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/ci/cfs-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Create venv (EL8 python3.11)
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python3.11 -m venv "$HOME/venv"
      - name: Install ironbird
        if: steps.setup.outputs.ready == 'true'
        run: |
          test "$(id -u)" -ne 0
          python -m pip install -c constraints-dev.txt -e '.[dev]'
      - name: Real-cFS acceptance tests as a non-root user
        if: steps.setup.outputs.ready == 'true'
        # One cFS instance owns fixed UDP ports and /dev/shm/osal:RAM (the container's own
        # network and shm namespaces): run serially.
        run: |
          test "$(id -u)" -ne 0
          pytest tests/cfs -m cfs -n0 -v -rP --basetemp="$HOME/pytest-cfs"
      - name: Keep cFS console logs on failure
        if: failure() && steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cfs-logs-el8-${{ matrix.name }}
          path: /home/ci/pytest-cfs
          if-no-files-found: ignore
      - name: Hand the workspace back to root (root)
        if: always()
        shell: bash
        run: chown -R root:root "$GITHUB_WORKSPACE"

  fuzz:
    name: fuzz ${{ matrix.target }}
    # Scheduled only: coverage-guided fuzzing is too slow for every push. One runner per harness,
    # in parallel; every harness in tools/fuzz must be listed (tests/test_fuzz_harnesses.py).
    if: github.event.schedule == '17 4 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # target: tools/fuzz/fuzz_<target>.py; seconds: its fuzzing time
          - {target: decode, seconds: 1200}      # Codec.decode and header.unpack, 3 header sets
          - {target: framer, seconds: 900}       # the serial stream framer
          - {target: recording, seconds: 900}    # the recording reader, scan and info
          - {target: replay, seconds: 900}       # replay and the definitions a recording embeds
          - {target: export, seconds: 900}       # export to CSV, text and JSONL
          - {target: filter, seconds: 600}       # the filter language
          - {target: config, seconds: 600}       # config TOML
          - {target: header_profile, seconds: 600}  # header-profile TOML
          - {target: ccdd, seconds: 900}         # the CCDD JSON loader and the codec built from it
          - {target: retention, seconds: 600}    # notices file, ledger heads and reserves, names
          - {target: ledger, seconds: 600}       # ledger record formatting
          - {target: render, seconds: 600}       # terminal text, JSON records, spreadsheet cells
          - {target: schema, seconds: 900}       # structure-aware edits of CCDD, config and profile docs
          - {target: grammar, seconds: 300}      # sizes, durations, --split, --from/--to, types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      # The harnesses build their seeds from tests/ (recordings, corpus files), which needs the
      # test dependencies as well as atheris.
      - name: Install
        run: python -m pip install -c constraints-dev.txt -e '.[dev,fuzz]'
      # Inputs that found new coverage on earlier nights: each night starts from them.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        env:
          IRONBIRD_FUZZ_CORPUS: ${{ runner.temp }}/fuzz-corpus
        # libFuzzer writes the failing input (crash-*, timeout-*, oom-*) under the artifact prefix.
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-crashes"
          python tools/fuzz/fuzz_${{ matrix.target }}.py -max_total_time=${{ matrix.seconds }} \
            -artifact_prefix="$RUNNER_TEMP/fuzz-crashes/"
      # Keep only the inputs that add coverage, so the corpus (and each night's start-up) stays
      # bounded instead of growing every night.
      - name: Minimize the corpus
        if: always()
        env:
          IRONBIRD_FUZZ_CORPUS: ${{ runner.temp }}/fuzz-corpus
        run: |
          old="$RUNNER_TEMP/fuzz-corpus-old"
          rm -rf "$old"
          mkdir -p "$IRONBIRD_FUZZ_CORPUS/fuzz_${{ matrix.target }}"
          mv "$IRONBIRD_FUZZ_CORPUS" "$old"
          python tools/fuzz/fuzz_${{ matrix.target }}.py -merge=1 \
            -artifact_prefix="$RUNNER_TEMP/fuzz-crashes/" "$old/fuzz_${{ matrix.target }}" \
            || cp -a "$old" "$IRONBIRD_FUZZ_CORPUS"
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-crashes
          if-no-files-found: ignore
